<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">Container Network from Scratch</title>
  <desc id="desc">A professional technical diagram showing red and blue Linux network namespaces connected by veth pairs to the br-study Linux bridge, routed by the host through NAT masquerading to the internet. A build sequence with exact commands appears on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="hostFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142039" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0e182a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d7e3f4"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f7b955"/>
    </marker>
    <style>
      .sans { font-family: Arial, sans-serif; }
      .mono { font-family: Menlo, monospace; }
      .title { font-size: 42px; font-weight: 760; fill: #f8fbff; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; fill: #9eafc5; }
      .section { font-size: 16px; font-weight: 700; fill: #91a5bf; letter-spacing: 2.2px; }
      .node-title { font-size: 25px; font-weight: 740; fill: #f8fbff; }
      .node-detail { font-size: 18px; fill: #c8d6e7; }
      .small { font-size: 15px; fill: #94a8c1; }
      .command { font-size: 15.5px; fill: #d9e6f4; }
      .step-title { font-size: 19px; font-weight: 720; fill: #f8fbff; }
      .step-number { font-size: 17px; font-weight: 800; fill: #07111f; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 16px; font-weight: 650; fill: #d7e3f4; }
      .chip { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1920" height="1280" fill="url(#background)"/>
  <circle cx="142" cy="76" r="27" fill="#21c7a8" opacity="0.18"/>
  <circle cx="142" cy="76" r="13" fill="#21c7a8"/>
  <text x="188" y="74" class="sans title">Container Network from Scratch</text>
  <text x="188" y="108" class="sans subtitle">Linux namespaces, bridge forwarding and outbound NAT — built manually</text>
  <rect x="72" y="139" width="960" height="2" rx="1" fill="#263852"/>
  <rect x="1110" y="139" width="738" height="2" rx="1" fill="#263852"/>

  <!-- Left: topology -->
  <text x="72" y="181" class="sans section">FINISHED TOPOLOGY</text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="363" y="198" width="374" height="106" rx="53" fill="#102b26" stroke="#31d39f" stroke-width="2"/>
    <circle cx="407" cy="251" r="18" fill="#31d39f" opacity="0.18"/>
    <path d="M396 253a11 11 0 0 1 21-5 9 9 0 0 1 2 18h-23a7 7 0 0 1 0-13z" fill="none" stroke="#50e2b1" stroke-width="2"/>
    <text x="550" y="247" class="sans node-title" text-anchor="middle">Internet</text>
    <text x="550" y="275" class="sans small" text-anchor="middle">External network</text>
  </g>

  <!-- Host boundary -->
  <rect x="72" y="356" width="960" height="830" rx="28" fill="url(#hostFill)" stroke="#314766" stroke-width="2"/>
  <rect x="96" y="377" width="137" height="32" rx="16" fill="#233551"/>
  <text x="164" y="399" class="sans chip" fill="#bcd0e8" text-anchor="middle">LINUX HOST</text>
  <text x="998" y="398" class="sans small" text-anchor="end">Ubuntu VM · OrbStack</text>

  <!-- NAT / host routing -->
  <g filter="url(#shadow)">
    <rect x="279" y="438" width="546" height="137" rx="22" fill="#302517" stroke="#f2aa3c" stroke-width="2"/>
    <rect x="304" y="462" width="112" height="28" rx="14" fill="#f2aa3c"/>
    <text x="360" y="481" class="sans chip" fill="#1d160b" text-anchor="middle">HOST ROUTER</text>
    <text x="552" y="500" class="sans node-title" text-anchor="middle">IP forwarding + NAT</text>
    <text x="552" y="532" class="mono node-detail" text-anchor="middle">eth0: 192.168.139.35</text>
    <text x="552" y="558" class="sans small" text-anchor="middle">Default gateway: 192.168.139.1</text>
  </g>

  <!-- Bridge -->
  <g filter="url(#shadow)">
    <rect x="214" y="663" width="676" height="146" rx="24" fill="#0d3033" stroke="#27c2bc" stroke-width="2"/>
    <rect x="239" y="687" width="116" height="28" rx="14" fill="#27c2bc"/>
    <text x="297" y="706" class="sans chip" fill="#071a1c" text-anchor="middle">L2 BRIDGE</text>
    <text x="552" y="741" class="sans node-title" text-anchor="middle">br-study</text>
    <text x="552" y="774" class="mono node-detail" text-anchor="middle">10.0.0.254/24</text>
    <text x="328" y="791" class="mono small" text-anchor="middle">veth-r-br</text>
    <text x="776" y="791" class="mono small" text-anchor="middle">veth-b-br</text>
  </g>

  <!-- Namespaces -->
  <g filter="url(#shadow)">
    <rect x="130" y="901" width="382" height="187" rx="24" fill="#331b24" stroke="#f06d85" stroke-width="2"/>
    <rect x="155" y="925" width="139" height="28" rx="14" fill="#f06d85"/>
    <text x="225" y="944" class="sans chip" fill="#250a10" text-anchor="middle">NAMESPACE</text>
    <text x="321" y="985" class="sans node-title" text-anchor="middle">red</text>
    <text x="321" y="1018" class="mono node-detail" text-anchor="middle">veth-r · 10.0.0.1/24</text>
    <text x="321" y="1052" class="sans small" text-anchor="middle">default via 10.0.0.254 · lo UP</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="592" y="901" width="382" height="187" rx="24" fill="#152744" stroke="#5f9ff5" stroke-width="2"/>
    <rect x="617" y="925" width="139" height="28" rx="14" fill="#5f9ff5"/>
    <text x="687" y="944" class="sans chip" fill="#08172c" text-anchor="middle">NAMESPACE</text>
    <text x="783" y="985" class="sans node-title" text-anchor="middle">blue</text>
    <text x="783" y="1018" class="mono node-detail" text-anchor="middle">veth-b · 10.0.0.2/24</text>
    <text x="783" y="1052" class="sans small" text-anchor="middle">default via 10.0.0.254 · lo UP</text>
  </g>

  <!-- Packet path and links -->
  <path d="M550 438 L550 314" fill="none" stroke="#f7b955" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <rect x="586" y="336" width="250" height="34" rx="17" fill="#201c17" stroke="#6e552f"/>
  <text x="711" y="358" class="sans label" text-anchor="middle" fill="#f7c976">MASQUERADE via eth0</text>

  <path d="M550 663 L550 584" fill="none" stroke="#d7e3f4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="575" y="630" class="sans label">route + forward</text>

  <path d="M321 901 L321 817" fill="none" stroke="#f28aa0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M783 901 L783 817" fill="none" stroke="#79b2ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="331" y="856" class="sans small">veth pair</text>
  <text x="793" y="856" class="sans small">veth pair</text>

  <!-- Validation strip -->
  <rect x="112" y="1113" width="880" height="50" rx="15" fill="#10291f" stroke="#2c9d70"/>
  <circle cx="143" cy="1138" r="12" fill="#31d39f"/>
  <path d="M137 1138l4 4 8-9" fill="none" stroke="#062016" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="169" y="1144" class="sans label" fill="#bdf6dd">Internal ping passed · External ping passed · 20/20 pytest checks passed</text>

  <!-- Right: command sequence -->
  <text x="1110" y="181" class="sans section">BUILD SEQUENCE</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="204" width="738" height="112" rx="20" fill="#17243a" stroke="#3b526f"/>
    <circle cx="1150" cy="244" r="21" fill="#91a5bf"/>
    <text x="1150" y="244" class="sans step-number">1</text>
    <text x="1185" y="239" class="sans step-title">Create the namespaces</text>
    <text x="1185" y="271" class="mono command">sudo ip netns add red</text>
    <text x="1185" y="296" class="mono command">sudo ip netns add blue</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="334" width="738" height="143" rx="20" fill="#102c30" stroke="#277d7c"/>
    <circle cx="1150" cy="374" r="21" fill="#27c2bc"/>
    <text x="1150" y="374" class="sans step-number">2</text>
    <text x="1185" y="369" class="sans step-title">Create and address the bridge</text>
    <text x="1185" y="402" class="mono command">sudo ip link add br-study type bridge</text>
    <text x="1185" y="427" class="mono command">sudo ip link set br-study up</text>
    <text x="1185" y="452" class="mono command">sudo ip addr add 10.0.0.254/24 dev br-study</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="495" width="738" height="221" rx="20" fill="#2c1921" stroke="#98475a"/>
    <circle cx="1150" cy="535" r="21" fill="#f06d85"/>
    <text x="1150" y="535" class="sans step-number">3</text>
    <text x="1185" y="530" class="sans step-title">Wire the red namespace</text>
    <text x="1185" y="563" class="mono command">sudo ip link add veth-r type veth peer name veth-r-br</text>
    <text x="1185" y="588" class="mono command">sudo ip link set veth-r netns red</text>
    <text x="1185" y="613" class="mono command">sudo ip link set veth-r-br master br-study</text>
    <text x="1185" y="638" class="mono command">sudo ip link set veth-r-br up</text>
    <text x="1185" y="663" class="mono command">sudo ip netns exec red ip addr add 10.0.0.1/24 dev veth-r</text>
    <text x="1185" y="688" class="mono command">sudo ip netns exec red ip link set veth-r up</text>
    <text x="1185" y="713" class="mono command">sudo ip netns exec red ip link set lo up</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="734" width="738" height="221" rx="20" fill="#142541" stroke="#416fbd"/>
    <circle cx="1150" cy="774" r="21" fill="#5f9ff5"/>
    <text x="1150" y="774" class="sans step-number">4</text>
    <text x="1185" y="769" class="sans step-title">Wire the blue namespace</text>
    <text x="1185" y="802" class="mono command">sudo ip link add veth-b type veth peer name veth-b-br</text>
    <text x="1185" y="827" class="mono command">sudo ip link set veth-b netns blue</text>
    <text x="1185" y="852" class="mono command">sudo ip link set veth-b-br master br-study</text>
    <text x="1185" y="877" class="mono command">sudo ip link set veth-b-br up</text>
    <text x="1185" y="902" class="mono command">sudo ip netns exec blue ip addr add 10.0.0.2/24 dev veth-b</text>
    <text x="1185" y="927" class="mono command">sudo ip netns exec blue ip link set veth-b up</text>
    <text x="1185" y="952" class="mono command">sudo ip netns exec blue ip link set lo up</text>
  </g>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="973" width="738" height="239" rx="20" fill="#302517" stroke="#9a6e2d"/>
    <circle cx="1150" cy="1013" r="21" fill="#f2aa3c"/>
    <text x="1150" y="1013" class="sans step-number">5</text>
    <text x="1185" y="1008" class="sans step-title">Route, forward and masquerade</text>
    <text x="1185" y="1041" class="mono command">sudo ip netns exec red ip route add default via 10.0.0.254</text>
    <text x="1185" y="1066" class="mono command">sudo ip netns exec blue ip route add default via 10.0.0.254</text>
    <text x="1185" y="1091" class="mono command">sudo sysctl -w net.ipv4.ip_forward=1</text>
    <text x="1185" y="1116" class="mono command">sudo iptables -A FORWARD -i br-study -j ACCEPT</text>
    <text x="1185" y="1141" class="mono command">sudo iptables -A FORWARD -o br-study -j ACCEPT</text>
    <text x="1185" y="1166" class="mono command">sudo iptables -t nat -A POSTROUTING </text>
    <text x="1185" y="1191" class="mono command">  -s 10.0.0.0/24 -o eth0 -j MASQUERADE</text>
  </g>

  <text x="72" y="1243" class="sans small">Lab evidence · Completed 16 October 2026</text>
  <text x="1848" y="1243" class="sans small" text-anchor="end">Addresses and interface names observed in this lab environment</text>
</svg>
